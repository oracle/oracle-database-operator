version: "2"

run:
  timeout: 10m
  tests: false

linters:
  default: none
  exclusions:
    rules:
    - path: ^apis/database/v4/(oraclerestart|racdatabase|shardingdatabase)_webhook\.go$
      linters:
        - unused
    - path: ^commons/crs/rac/
      linters:
        - unused
    - path: ^commons/crs/restart/
      linters:
        - unused
    - path: ^controllers/database/lrpdb_controller\.go$
      linters:
        - govet
      text: "non-constant format string|Printf format %d has arg .* of wrong type"
    # Data Guard retains these compatibility fields until all controller/API
    # consumers migrate together.
    - path: ^controllers/dataguard/
      linters:
        - staticcheck
      text: "SA1019:.*(Requeue|AdminPassword)"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
