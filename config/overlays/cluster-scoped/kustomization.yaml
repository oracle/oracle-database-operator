apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../default

patches:
- path: manager_cluster_scope_patch.yaml
  target:
    group: apps
    version: v1
    kind: Deployment
    name: controller-manager
- path: manager_role_cluster_scope_patch.yaml
  target:
    group: rbac.authorization.k8s.io
    version: v1
    kind: Role
    name: manager-role
- path: manager_rolebinding_cluster_scope_patch.yaml
  target:
    group: rbac.authorization.k8s.io
    version: v1
    kind: RoleBinding
    name: oracle-database-operator-manager-rolebinding
