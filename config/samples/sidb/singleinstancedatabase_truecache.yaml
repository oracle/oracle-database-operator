#
# Same-cluster True Cache (TCP). Pair with singleinstancedatabase_truecache_primary.yaml
# after that primary has published ConfigMap <primary-name>-truecache-blob
# (trueCache.generateBlob and trueCache.createConfigMap).
#

apiVersion: database.oracle.com/v4
kind: SingleInstanceDatabase
metadata:
  name: truecache
  namespace: default
spec:
  ## Use only alphanumeric characters for sid
  sid: ORCLTC

  ## DB edition
  ## True Cache is supported only with enterprise edition.
  edition: enterprise

  ## DB type
  createAs: truecache

  ## Same Kubernetes cluster and namespace only. Cross-cluster or external
  ## primaries use primarySource.connectString instead (see *_external*.yaml).
  ## Lab alternative: primarySource.connectString: "sidb-sample:1521/ORCLPRD"
  primarySource:
    databaseRef: "sidb-sample"
    ## Optional: primary CDB short DB_NAME (SELECT name FROM v$database), e.g. ORCLPRD.
    ## Not DB_UNIQUE_NAME, not a SCAN/service string, not the True Cache SID.
    ## Omit to let provisioning resolve PRIMARY_DB_NAME from the primary (works).
    ## Set the short name when you want an explicit PRIMARY_DB_NAME; may avoid
    ## inheriting the primary db_domain on the True Cache database.
    # dbName: "ORCLPRD"

  ## Optional: custom primary-host helper path for autoTCServiceRegistration.
  ## Top-level spec.envVars (not under trueCache). Needed when the helper is not
  ## at /home/oracle/configure-primary-truecache-service.sh — typically external
  ## or non-OCR primaries. OCR enterprise_ru keeps the prebaked default; leave unset.
  # envVars:
  #   - name: PRIMARY_TC_SERVICE_SCRIPT_PATH
  #     value: /custom/path/configure-primary-truecache-service.sh

  ## True Cache options
  trueCache:
    ## Explicitly reference the generated blob from the primary database.
    ## Default ConfigMap name is <primary-sidb-name>-truecache-blob.
    blobConfigMapRef: sidb-sample-truecache-blob
    blobConfigMapKey: tc_config_blob.tar.gz
    blobMountPath: /stage/tc_config_blob.tar.gz
    truedbUniqueName: "truecache_tc"
    ## Service mapping form:
    ##   PRIMARY_PDB_NAME:PRIMARY_SERVICE_NAME:TRUECACHE_SERVICE_NAME
    ## The first value is the primary PDB name.
    ##
    ## Quick Start / in-cluster OCR enterprise_ru: leave true and apply this YAML.
    ## The helper is prebaked in the image; it creates/starts the primary PDB
    ## service if needed and associates it with True Cache. No manual
    ## DBMS_SERVICE.CREATE_SERVICE before apply.
    ## External / non-OCR / auto=false: see docs/sidb/prerequisites/PREREQUISITES.md
    ## (#automatic-path-autotcserviceregistration-true, #true-cache-helper-install).
    ## After Healthy, verify TRUE_CACHE_SERVICE on the primary.
    autoTCServiceRegistration: true
    # primarySchedulerCredentialName: TC_ORACLE_OS_CRED
    trueCacheServices:
      - "APPPDB1:tpdb_primary:tpdb_cache"

  ## Optional static host-to-IP mappings added to the True Cache pod /etc/hosts.
  ## Useful when the primary database hostname must resolve to a fixed IP.
  # hostAliases:
  #   - ip: "10.2.1.241"
  #     hostnames:
  #       - "sidb-sample.internal.example.com"
  #       - "sidb-sample"

  ## Grouped security settings
  security:
    secrets:
      admin:
        secretName: db-admin-secret
        secretKey: oracle_pwd
        keepSecret: true
      tde:
        secretName: tde-wallet-secret
        secretKey: tde_wallet_pwd
    ## For TCPS same-cluster, see singleinstancedatabase_truecache_same_cluster_tcps.yaml

  ## Database image details
  image:
    ## Oracle True Cache requires a True Cache capable enterprise image.
    pullFrom: container-registry.oracle.com/database/enterprise_ru:latest
    ## OCR database/enterprise_ru requires authenticated pull (accept OCR
    ## terms + auth token). Create ocr-reg-cred in this namespace.
    ## Anonymous pull of this licensed image is not supported.
    pullSecrets: ocr-reg-cred
    prebuiltDB: false
    imagePullPolicy: Always

  ## Optional: SIDB initParams and pod resources (not True Cache-specific).
  ## Uncomment and tune for lab or production. Omit both to use image/operator defaults.
  # initParams:
  #   sgaTarget: 3072
  #   pgaAggregateTarget: 1024
  #   cpuCount: 2
  #   processes: 600
  # resources:
  #   requests:
  #     memory: "12Gi"
  #     cpu: "2"
  #   limits:
  #     memory: "24Gi"
  #     cpu: "4"

  ## Optional node selector to restrict the database pod to nodes having specific labels.
  ## For a single exact node, kubernetes.io/hostname can be used.
  # nodeSelector:
  #   kubernetes.io/hostname: worker-node.example

  ## size is the required minimum size of the persistent volume
  ## storageClass is specified for automatic volume provisioning
  ## accessMode can only accept one of ReadWriteOnce, ReadWriteMany
  persistence:
    oradata:
      size: 60Gi
      ## oci-bv applies to OCI block volumes. Use "standard" storageClass for
      ## dynamic provisioning in Minikube. Update as appropriate for other CSPs.
      storageClass: "oci-bv"
      accessMode: "ReadWriteOnce"
    ## Recommended so the oracle user can write under oradata on the PVC.
    setWritePermissions: true

  ## Count of Database Pods. Should be 1 for True Cache.
  replicas: 1
