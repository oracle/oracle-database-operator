# Data Guard Broker: TCP with a databaseRef standby.
# Procedure: docs/sidb/README.md#data-guard
# For the exact sample names, namespace, endpoints, Secrets, and initial roles only.
# Create and verify both SIDBs before applying. Apply only one Broker sample.
# Generate from current standby status if you changed the SIDB YAMLs.

apiVersion: database.oracle.com/v4
kind: DataguardBroker
metadata:
  name: standbydatabase-sample-dg
  namespace: default
spec:
  execution:
    image: container-registry.oracle.com/database/enterprise_ru:latest
    imagePullSecrets:
      - ocr-reg-cred
    authWallet:
      enabled: true
  topology:
    sourceKind: SingleInstanceDatabase
    sourceRef:
      apiVersion: database.oracle.com/v4
      kind: SingleInstanceDatabase
      name: standbydatabase-sample
      namespace: default
    defaults:
      adminSecretRef:
        secretName: db-admin-secret
        secretKey: oracle_pwd
    members:
      - name: sidb-sample
        dbUniqueName: ORCL1
        role: PRIMARY
        localRef:
          apiVersion: database.oracle.com/v4
          kind: SingleInstanceDatabase
          name: sidb-sample
          namespace: default
        endpoints:
          - name: tcp
            host: sidb-sample.default.svc.cluster.local
            port: 1521
            protocol: TCP
            serviceName: ORCL1
      - name: standbydatabase-sample
        dbUniqueName: ORCLS
        role: PHYSICAL_STANDBY
        localRef:
          apiVersion: database.oracle.com/v4
          kind: SingleInstanceDatabase
          name: standbydatabase-sample
          namespace: default
        endpoints:
          - name: tcp
            host: standbydatabase-sample.default.svc.cluster.local
            port: 1521
            protocol: TCP
            serviceName: ORCLS
