# Four-member DataguardBroker using direct SIDB NodePorts (no CMAN).
# Apply in Cluster 2. Merge render-dg-broker-from-status.sh outputs if preferred.
# See docs/sidb/dataguard/DATAGUARD_MULTI_CLUSTER_NODEPORT.md.

apiVersion: database.oracle.com/v4
kind: DataguardBroker
metadata:
  name: sidb-multi-dg
  namespace: <operator-watched-namespace>
spec:
  execution:
    authWallet:
      enabled: true
    image: container-registry.oracle.com/database/enterprise_ru:latest
    imagePullSecrets:
      - ocr-reg-cred
  topology:
    defaults:
      adminSecretRef:
        secretKey: oracle_pwd
        secretName: db-admin-secret
    members:
      - dbUniqueName: ORCLPRD
        name: primary-nodeport
        role: PRIMARY
        endpoints:
          - host: "<cluster1-node-ip>"
            name: tcp
            port: 32330
            protocol: TCP
            serviceName: ORCLPRD
      - dbUniqueName: ORCLSTBY1
        name: sidb-standby1
        role: PHYSICAL_STANDBY
        endpoints:
          - host: "<cluster1-node-ip>"
            name: tcp
            port: 30281
            protocol: TCP
            serviceName: ORCLSTBY1
      - dbUniqueName: ORCLSTBY2
        name: sidb-standby2
        role: PHYSICAL_STANDBY
        endpoints:
          - host: "<cluster2-node-ip>"
            name: tcp
            port: 30282
            protocol: TCP
            serviceName: ORCLSTBY2
        localRef:
          apiVersion: database.oracle.com/v4
          kind: SingleInstanceDatabase
          name: sidb-standby2
          namespace: <operator-watched-namespace>
      - dbUniqueName: ORCLSTBY3
        name: sidb-standby3
        role: PHYSICAL_STANDBY
        endpoints:
          - host: "<cluster2-node-ip>"
            name: tcp
            port: 30283
            protocol: TCP
            serviceName: ORCLSTBY3
        localRef:
          apiVersion: database.oracle.com/v4
          kind: SingleInstanceDatabase
          name: sidb-standby3
          namespace: <operator-watched-namespace>
    sourceKind: SingleInstanceDatabase
    sourceRef:
      apiVersion: database.oracle.com/v4
      kind: SingleInstanceDatabase
      name: sidb-standby3
      namespace: <operator-watched-namespace>
