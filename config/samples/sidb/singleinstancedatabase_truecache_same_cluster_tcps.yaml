#
# Same-cluster True Cache with TCPS. Pair with
# singleinstancedatabase_truecache_primary_tcps.yaml after that primary has:
# - published ConfigMap <primary-name>-truecache-blob
# - security.tcps enabled and a TLS secret whose SANs match client hostnames
#
# Prefer services.endpoints over deprecated services.external.
# Same-cluster: ClusterIP with TCP 1521 + TCPS 2484. LoadBalancer belongs on
# cross-cluster / external samples (*_peered, *_external*), not here.
#

apiVersion: database.oracle.com/v4
kind: SingleInstanceDatabase
metadata:
  name: truecache
  namespace: default
spec:
  ## Use only alphanumeric characters for sid
  sid: ORCLTC

  ## True Cache is supported only with enterprise edition.
  edition: enterprise
  createAs: truecache

  ## Same-namespace primary SIDB reference.
  primarySource:
    databaseRef: sidb-sample
    ## Optional: primary CDB short DB_NAME (v$database.name). See docs/sidb/README.md
    ## Source Database Reference. Omit = resolve from primary; set = explicit value
    ## (may avoid inheriting primary db_domain on the True Cache database).
    # dbName: "ORCLPRD"

  ## Optional override for auto registration helper path.
  # envVars:
  #   - name: PRIMARY_TC_SERVICE_SCRIPT_PATH
  #     value: /home/oracle/configure-primary-truecache-service.sh

  trueCache:
    ## ConfigMap generated by the primary SIDB (default name <primary>-truecache-blob).
    blobConfigMapRef: sidb-sample-truecache-blob
    blobConfigMapKey: tc_config_blob.tar.gz
    blobMountPath: /stage/tc_config_blob.tar.gz
    truedbUniqueName: "truecache_tc"
    ## PRIMARY_PDB_NAME:PRIMARY_SERVICE_NAME:TRUECACHE_SERVICE_NAME
    trueCacheServices:
      - "APPPDB1:TPDB_PRIMARY:tpdb_cache"
    ## When true, complete docs/sidb/prerequisites/PREREQUISITES.md (helper + externaljob.ora).
    ## Readiness does not prove primary-side association; verify on primary.
    autoTCServiceRegistration: true

  security:
    secrets:
      admin:
        secretName: db-admin-secret
        secretKey: oracle_pwd
        keepSecret: true
      tde:
        secretName: tde-wallet-secret
        secretKey: tde_wallet_pwd
    tcps:
      enabled: true
      ## Lab often reused the primary TLS secret when SANs cover both names.
      ## Prefer a dedicated secret (for example sidb-truecache-tcps-tls) when SANs differ.
      tlsSecret: sidb-primary-tcps-tls

  image:
    ## True Cache capable enterprise image.
    pullFrom: container-registry.oracle.com/database/enterprise_ru:latest
    ## OCR database/enterprise_ru requires authenticated pull (accept OCR
    ## terms + auth token). Create ocr-reg-cred in this namespace.
    ## Anonymous pull of this licensed image is not supported.
    pullSecrets: ocr-reg-cred
    prebuiltDB: false
    imagePullPolicy: Always

  ## Optional: SIDB initParams and pod resources (not True Cache-specific).
  ## Uncomment and tune for lab or production. Omit both to use image/operator defaults.
  # initParams:
  #   sgaTarget: 3072
  #   pgaAggregateTarget: 1024
  #   cpuCount: 2
  #   processes: 600
  # resources:
  #   requests:
  #     memory: "12Gi"
  #     cpu: "2"
  #   limits:
  #     memory: "24Gi"
  #     cpu: "4"

  persistence:
    oradata:
      size: 60Gi
      storageClass: "oci-bv"
      accessMode: "ReadWriteOnce"
    setWritePermissions: true

  ## Same-cluster: ClusterIP with TCP 1521 + TCPS 2484. Cross-cluster True Cache
  ## samples use LoadBalancer instead.
  services:
    endpoints:
      - name: listener
        type: ClusterIP
        tcp:
          enabled: true
          port: 1521
        tcps:
          enabled: true
          port: 2484

  ## Count of Database Pods. Should be 1 for True Cache.
  replicas: 1
