# Data Guard Broker: TDE and TCPS with a connectString standby.
# Procedure: docs/sidb/README.md#data-guard
# For the exact sample names, namespace, endpoints, Secrets, and initial roles only.
# Create and verify both SIDBs before applying. Apply only one Broker sample.
# Generate from current standby status if you changed the SIDB YAMLs.
# Verify both SIDB status.clientWalletSecret values match the effective wallet references.
# The standby inherits topology.defaults.tcps; the primary sets its own wallet.

apiVersion: database.oracle.com/v4
kind: DataguardBroker
metadata:
  name: standbydatabase-sample-dg
  namespace: default
spec:
  execution:
    authWallet:
      enabled: true
    image: container-registry.oracle.com/database/enterprise_ru:latest
    imagePullSecrets:
      - ocr-reg-cred
  topology:
    defaults:
      adminSecretRef:
        secretKey: oracle_pwd
        secretName: db-admin-secret
      tcps:
        clientWalletSecret: standbydatabase-sample-dg-client-wallet
    members:
      - dbUniqueName: ORCL1
        endpoints:
          - host: sidb-sample.default.svc.cluster.local
            name: tcp
            port: 1521
            protocol: TCP
            serviceName: ORCL1
          - host: sidb-sample.default.svc.cluster.local
            name: tcps
            port: 2484
            protocol: TCPS
            serviceName: ORCL1
        name: sidb-sample
        role: PRIMARY
        tcps:
          enabled: true
          clientWalletSecret: sidb-sample-dg-client-wallet
        localRef:
          apiVersion: database.oracle.com/v4
          kind: SingleInstanceDatabase
          name: sidb-sample
          namespace: default
      - dbUniqueName: ORCLS
        endpoints:
          - host: standbydatabase-sample.default.svc.cluster.local
            name: tcp
            port: 1521
            protocol: TCP
            serviceName: ORCLS
          - host: standbydatabase-sample.default.svc.cluster.local
            name: tcps
            protocol: TCPS
            serviceName: ORCLS
            port: 2484
        localRef:
          apiVersion: database.oracle.com/v4
          kind: SingleInstanceDatabase
          name: standbydatabase-sample
          namespace: default
        name: standbydatabase-sample
        role: PHYSICAL_STANDBY
        tcps:
          enabled: true
    sourceKind: SingleInstanceDatabase
    sourceRef:
      apiVersion: database.oracle.com/v4
      kind: SingleInstanceDatabase
      name: standbydatabase-sample
      namespace: default
