# Data Guard standby: same cluster and namespace, TDE and TCPS.
# Procedure: docs/sidb/README.md#data-guard
# Edit namespace, StorageClass, capacity, and image pull Secret for your environment.

apiVersion: database.oracle.com/v4
kind: SingleInstanceDatabase
metadata:
  name: standbydatabase-sample
  namespace: default
spec:
  sid: ORCLS
  edition: enterprise
  createAs: standby

  ## The primary SIDB must exist in the same cluster and namespace.
  primarySource:
    databaseRef: sidb-sample

  security:
    secrets:
      admin:
        secretName: db-admin-secret
        secretKey: oracle_pwd
        keepSecret: true
      ## Create this Secret before applying; see the linked TDE prerequisites.
      tde:
        secretName: sidb-standby-tde-wallet
        secretKey: tde_wallet_pwd
        walletZipFileKey: wallet.zip
        walletRoot: /opt/oracle/oradata/ORCLS/tdewallet
    ## Create the corresponding TLS Secret before applying this sample.
    tcps:
      enabled: true
      tlsSecret: sidb-standby-tcps-tls

  image:
    pullFrom: container-registry.oracle.com/database/enterprise_ru:latest
    pullSecrets: ocr-reg-cred
    imagePullPolicy: IfNotPresent

  persistence:
    oradata:
      size: 100Gi
      storageClass: oci-bv
      accessMode: ReadWriteOnce


  ## Optional explicit Service configuration.
  ## This workflow uses the operator-created default ClusterIP Service.
  # services:
  #   endpoints:
  #     - name: cluster
  #       type: ClusterIP
  #       tcp:
  #         enabled: true
  #         port: 1521
  #       tcps:
  #         enabled: true
  #         port: 2484

  replicas: 1
