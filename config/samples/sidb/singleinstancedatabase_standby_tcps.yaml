apiVersion: database.oracle.com/v4
kind: SingleInstanceDatabase
metadata:
  # Creates a standby database using databaseRef with TCPS enabled.
  # Update namespace, secrets, TLS secret, image, and storage class before applying.
  name: standbydatabase-sample
  namespace: default
spec:
  ## Use only alphanumeric characters for sid.
  sid: ORCLS

  ## Intended type of database.
  createAs: standby

  ## Source primary database for the standby operation.
  ## Use databaseRef when the primary SIDB exists in the same namespace.
  ## Set exactly one of primarySource.databaseRef, primarySource.connectString, or primarySource.details.
  ##
  ## For example: In current case
  ## databaseRef: sidb-sample
  primarySource:
    databaseRef: "<primarySource.databaseRef>"

  ## Grouped security settings.
  ## For standby, use the source primary database admin secret.
  security:
    secrets:
      admin:
        secretName: db-admin-secret
        secretKey: oracle_pwd
        keepSecret: true
    tcps:
      enabled: true
      tlsSecret: standby-db-tcps-secret

  ## Database image details.
  ## Use an image compatible with the primary database major version.
  image:
    pullFrom: container-registry.oracle.com/database/enterprise_ru:latest-19
    imagePullPolicy: IfNotPresent
    pullSecrets: oracle-container-registry-secret

  ## Database storage details.
  persistence:
    oradata:
      size: 100Gi
      storageClass: oci-bv
      accessMode: ReadWriteOnce

  ## Optional service endpoint configuration.
  ## Enable tcps only when spec.security.tcps.enabled is true.
  services:
    endpoints:
      - name: nodeport
        type: NodePort
        tcp:
          enabled: true
        tcps:
          enabled: true

  ## Optional Data Guard prerequisite setup.
  ## Enable this only when preparing this database for Data Guard workflows.
  # dataguard:
  #   prereqs:
  #     enabled: true

  replicas: 1
