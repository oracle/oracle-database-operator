apiVersion: database.oracle.com/v4
kind: SingleInstanceDatabase
metadata:
  # Creates a standby database using primarySource.connectString with TCPS enabled.
  # Update namespace, secrets, TLS secret, image, storage class, and connect string before applying.
  name: standbydatabase-sample
  namespace: default
spec:
  ## Use only alphanumeric characters for sid.
  sid: ORCLS
  edition: enterprise

  ## Intended type of database.
  createAs: standby

  ## Primary TCP endpoint for standby bootstrap; TCPS uses the separate port below.
  ## Pair with singleinstancedatabase_dataguard_primary_tde_tcps.yaml.
  ## Set exactly one source selector; databaseRef is shown only as an alternative.
  primarySource:
    # databaseRef: sidb-sample
    connectString: "sidb-sample.default.svc.cluster.local:1521/ORCL1"

  ## Grouped security settings.
  ## For standby, use the source primary database admin secret.
  security:
    secrets:
      admin:
        secretName: db-admin-secret
        secretKey: oracle_pwd
        keepSecret: true

      ## TDE wallet exported from the primary; create this Secret before applying.
      ## See docs/sidb/README.md#data-guard-setup-with-tde-and-tcps.
      ## Match the primary's reachable host and TCPS port above to your environment.
      ## For Oracle Database 19c, omit secretKey (walletZipFileKey only).
      ## For Oracle Database 23ai and later, secretKey is required.
      ## The operator validating webhook rejects secretKey on 19c standby images.
      tde:
        secretName: sidb-standby-tde-wallet
        # secretKey: tde_wallet_pwd   # enable for 23ai+ only
        walletZipFileKey: wallet.zip
        walletRoot: /opt/oracle/oradata/ORCLS/tdewallet

    tcps:
      enabled: true
      tlsSecret: sidb-standby-tcps-tls

  ## Database image details.
  ## Use an image compatible with the primary database major version.
  image:
    pullFrom: container-registry.oracle.com/database/enterprise_ru:latest
    pullSecrets: ocr-reg-cred
    imagePullPolicy: IfNotPresent

  ## Database storage details.
  persistence:
    oradata:
      size: 100Gi
      storageClass: oci-bv
      accessMode: ReadWriteOnce

  replicas: 1
