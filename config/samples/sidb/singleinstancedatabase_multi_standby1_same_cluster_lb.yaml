# Multi-standby standby1 in the same cluster as primary (OCI NLB).
# See docs/sidb/dataguard/DATAGUARD_MULTI_STANDBY_LB.md.

apiVersion: database.oracle.com/v4
kind: SingleInstanceDatabase
metadata:
  name: sidb-standby1
  namespace: <operator-watched-namespace>
spec:
  sid: ORCLSTBY1
  edition: enterprise
  createAs: standby
  flashBack: true

  primarySource:
    details:
      host: "<primary-nlb-ip-or-dns>"
      port: 1521
      sid: ORCLPRD

  security:
    secrets:
      admin:
        secretName: db-admin-secret
        secretKey: oracle_pwd
        keepSecret: true
      tde:
        secretName: tde-wallet-secret
        secretKey: tde_wallet_pwd
        walletZipFileKey: standby-wallet.zip
        walletRoot: /opt/oracle/oradata/dbconfig/ORCLSTBY1/.wallet

  image:
    pullFrom: container-registry.oracle.com/database/enterprise_ru:latest
    pullSecrets: ocr-reg-cred
    prebuiltDB: false
    imagePullPolicy: IfNotPresent

  dataguard:
    prereqs:
      enabled: true

  resources:
    requests:
      memory: "24Gi"
      cpu: "4"
    limits:
      memory: "24Gi"
      cpu: "4"

  persistence:
    oradata:
      size: 60Gi
      storageClass: "oci-bv"
      accessMode: "ReadWriteOnce"
    setWritePermissions: true

  services:
    external:
      type: LoadBalancer
      isKeep: false
      externalTrafficPolicy: Local
      annotations:
        oci.oraclecloud.com/load-balancer-type: "nlb"
        oci-network-load-balancer.oraclecloud.com/is-preserve-source: "false"
        oci-network-load-balancer.oraclecloud.com/internal: "true"
        oci-network-load-balancer.oraclecloud.com/subnet: "<primary-subnet-ocid>"
        service.beta.kubernetes.io/oci-load-balancer-connection-idle-timeout: "3600"
      tcp:
        enabled: true
        port: 1521

  replicas: 1
