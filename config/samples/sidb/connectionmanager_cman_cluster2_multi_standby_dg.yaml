# Cluster 2 CMAN for multi-standby Data Guard (standby2 + standby3).
# See docs/sidb/dataguard/DATAGUARD_MULTI_STANDBY_CMAN.md.

apiVersion: v1
kind: ConfigMap
metadata:
  name: cman-cluster2-config
  namespace: <operator-watched-namespace>
data:
  cman.ora: |
    # CMAN_TNSNAMES_BEGIN
    ORCLSTBY2 =
    (description=
      (address=(protocol=tcp)(host=sidb-standby2.default.svc.cluster.local)(port=1521))
      (connect_data=(service_name=ORCLSTBY2))
    )

    ORCLSTBY2_DGMGRL =
    (description=
      (address=(protocol=tcp)(host=sidb-standby2.default.svc.cluster.local)(port=1521))
      (connect_data=(service_name=ORCLSTBY2_DGMGRL))
    )

    ORCLSTBY3 =
    (description=
      (address=(protocol=tcp)(host=sidb-standby3.default.svc.cluster.local)(port=1521))
      (connect_data=(service_name=ORCLSTBY3))
    )

    ORCLSTBY3_DGMGRL =
    (description=
      (address=(protocol=tcp)(host=sidb-standby3.default.svc.cluster.local)(port=1521))
      (connect_data=(service_name=ORCLSTBY3_DGMGRL))
    )
    # CMAN_TNSNAMES_END

    CMAN_cman-sidb.default.svc.cluster.local =
    (configuration=
      (address=(protocol=tcp)(host=cman-sidb.default.svc.cluster.local)(port=1521))
      (parameter_list=
        (connection_statistics=yes)
        (log_directory=/u01/oracle/product/23ai/client_1/network/log)
        (log_level=user)
        (trace_directory=/u01/oracle/product/23ai/client_1/network/trace)
        (trace_level=user)
        (valid_node_checking_registration=on)
        (registration_invited_nodes=*)
        (use_service_as_tnsnames_alias=on)
      )
      (rule_list=
        (rule=
          (src=*)(dst=*)(srv=ORCLSTBY2)(act=accept)
          (action_list=(aut=off)(moct=0)(mct=0)(mit=0)(conn_stats=on))
        )
        (rule=
          (src=*)(dst=*)(srv=ORCLSTBY2_DGMGRL)(act=accept)
          (action_list=(aut=off)(moct=0)(mct=0)(mit=0)(conn_stats=on))
        )
        (rule=
          (src=*)(dst=*)(srv=ORCLSTBY3)(act=accept)
          (action_list=(aut=off)(moct=0)(mct=0)(mit=0)(conn_stats=on))
        )
        (rule=
          (src=*)(dst=*)(srv=ORCLSTBY3_DGMGRL)(act=accept)
          (action_list=(aut=off)(moct=0)(mct=0)(mit=0)(conn_stats=on))
        )
      )
    )
---
apiVersion: network.oracle.com/v4
kind: ConnectionManager
metadata:
  name: cman-sidb
  namespace: <operator-watched-namespace>
spec:
  runtime:
    image: "<cman-container-image>"
    imagePullPolicy: Always
    replicas: 1
  service:
    internal:
      enabled: true
      ports:
        - name: cman
          port: 1521
          targetPort: 1521
    external:
      enabled: true
      serviceType: NodePort
      externalTrafficPolicy: Cluster
      ports:
        - name: cman
          port: 1521
          targetPort: 1521
          nodePort: 30189
  configSource:
    configMapRef:
      name: cman-cluster2-config
      key: cman.ora
