# Cross-cluster Data Guard standby for the CMAN path.
# primarySource.connectString uses the primary-cluster CMAN NodePort.
# See docs/sidb/dataguard/DATAGUARD_CROSS_CLUSTER_CMAN.md.

apiVersion: database.oracle.com/v4
kind: SingleInstanceDatabase
metadata:
  name: sidb-standby
  namespace: <operator-watched-namespace>
spec:
  sid: ORCLSTBY
  edition: enterprise
  createAs: standby
  flashBack: true

  primarySource:
    connectString: "<primary-cman-node-ip>:30189/ORCLPRD"

  security:
    secrets:
      admin:
        secretName: db-admin-secret
        secretKey: oracle_pwd
        keepSecret: true
      tde:
        secretName: tde-wallet-secret
        secretKey: tde_wallet_pwd
        walletZipFileKey: standby-wallet.zip
        walletRoot: /opt/oracle/oradata/dbconfig/ORCLSTBY/.wallet

  image:
    pullFrom: container-registry.oracle.com/database/enterprise_ru:latest
    pullSecrets: ocr-reg-cred
    prebuiltDB: false
    imagePullPolicy: IfNotPresent
  dataguard:
    prereqs:
      enabled: true

  resources:
    requests:
      memory: "24Gi"
      cpu: "4"
    limits:
      memory: "24Gi"
      cpu: "4"

  persistence:
    oradata:
      size: 60Gi
      storageClass: oci-bv
      accessMode: ReadWriteOnce
    setWritePermissions: true

  # publishNotReadyAddresses keeps the NodePort backend available while the
  # pod is NotReady so cross-cluster RMAN can reach the auxiliary listener
  # (nodeIP:30281) during Duplicate. Operator also enables this for
  # cross-cluster / flashback standbys; keep it explicit in the sample.
  services:
    endpoints:
      - name: nodeport
        type: NodePort
        publishNotReadyAddresses: true
        tcp:
          enabled: true
          nodePort: 30281

  replicas: 1
