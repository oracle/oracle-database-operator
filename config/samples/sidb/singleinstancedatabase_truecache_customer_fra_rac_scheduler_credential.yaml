apiVersion: database.oracle.com/v4
kind: SingleInstanceDatabase
metadata:
  name: tck8node1
  namespace: tcdboper
spec:

  ## Customer-style True Cache repro for a RAC primary in FRA.
  ## Variant: DBMS_SCHEDULER executable job uses an explicit database
  ## credential to launch the primary helper as oracle.
  ##
  ## Primary prerequisites for this variant:
  ## - install /home/oracle/configure-primary-truecache-service.sh on every RAC node
  ## - create DBMS_SCHEDULER credential TC_ORACLE_OS_CRED on the primary DB
  ## - point spec.trueCache.primarySchedulerCredentialName at that credential

  edition: enterprise
  createAs: truecache

  primarySource:
    connectString: "drdbrac15a-scan.dbsubnet.vcnfra80.oraclevcn.com:1521/DB15_FRA.dbsubnet.vcnfra80.oraclevcn.com"

  sid: TCK8DB1

  nodeSelector:
    maarole: TC

  trueCache:
    blobConfigMapRef: orcl-primary-truecache-blob
    blobConfigMapKey: DB15_2026-04-27_07-38-34AM_67403.tar.gz
    blobMountPath: /stage/DB15_2026-04-27_07-38-34AM_67403.tar.gz
    truedbUniqueName: "TCK8DB1_FRA"
    primarySchedulerCredentialName: TC_ORACLE_OS_CRED
    ## PRIMARY_PDB_NAME:PRIMARY_SERVICE_NAME:TRUECACHE_SERVICE_NAME
    trueCacheServices:
      - "PDB1:tcokeprim.example.com:tcokenodes.example.com"
    autoTCServiceRegistration: true

  security:
    secrets:
      admin:
        secretName: db-admin-secret
        secretKey: oracle_pwd
        keepSecret: true
      tde:
        secretName: tde-wallet-secret
        secretKey: tde_wallet_pwd

  image:
    pullFrom: phx.ocir.io/intsanjaysingh/db-repo/oracle/database:truecache-23.26.1-ee-patch
    prebuiltDB: false
    imagePullPolicy: Always

  initParams:
    sgaTarget: 127000
    pgaAggregateTarget: 32000
    processes: 3200

  resources:
    requests:
      memory: "256Gi"
      cpu: "32"
    limits:
      memory: "256Gi"
      cpu: "32"

  persistence:
    oradata:
      size: 60Gi
      storageClass: "oci-bv"
      accessMode: "ReadWriteOnce"

  services:
    endpoints:
      - name: loadbalancer
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          oci.oraclecloud.com/load-balancer-type: "nlb"
          oci-network-load-balancer.oraclecloud.com/internal: "true"
          oci-network-load-balancer.oraclecloud.com/subnet: "ocid1.subnet.oc1.eu-frankfurt-1.aaaaaaaa4pzwn3hejbujrgavrfl3232swkmivflhpj7gvvligcw4t356ljna"
          external-dns.alpha.kubernetes.io/hostname: "tck8node1.tcinternal.example.com"
          oci-network-load-balancer.oraclecloud.com/is-preserve-source: "false"
        tcp:
          enabled: true
          port: 1521

  replicas: 1
