# Multi-standby standby1 (Cluster 1) with TCP+TCPS NodePorts.
# Bootstrap uses primary TCP NodePort; tcpsPort points at primary TCPS NodePort.
# See docs/sidb/dataguard/DATAGUARD_MULTI_STANDBY_TCPS_NODEPORT.md.
#
# Example ports: TCP 30281, TCPS 30284

apiVersion: database.oracle.com/v4
kind: SingleInstanceDatabase
metadata:
  name: sidb-standby1
  namespace: <operator-watched-namespace>
spec:
  sid: ORCLSTBY1
  edition: enterprise
  createAs: standby
  flashBack: true

  primarySource:
    connectString: "<cluster1-node-ip>:32331/ORCLPRD"
    tcpsPort: 32484

  security:
    secrets:
      admin:
        secretName: db-admin-secret
        secretKey: oracle_pwd
        keepSecret: true
      tde:
        secretName: tde-wallet-secret
        secretKey: tde_wallet_pwd
        walletZipFileKey: standby-wallet.zip
        walletRoot: /opt/oracle/oradata/dbconfig/ORCLSTBY1/.wallet
    tcps:
      enabled: true
      tlsSecret: sidb-standby-tcps-tls

  image:
    pullFrom: container-registry.oracle.com/database/enterprise_ru:latest
    pullSecrets: ocr-reg-cred
    prebuiltDB: false
    imagePullPolicy: IfNotPresent

  dataguard:
    prereqs:
      enabled: true

  resources:
    requests:
      memory: "24Gi"
      cpu: "4"
    limits:
      memory: "24Gi"
      cpu: "4"

  persistence:
    oradata:
      size: 60Gi
      storageClass: oci-bv
      accessMode: ReadWriteOnce
    setWritePermissions: true

  services:
    endpoints:
      - name: nodeport
        type: NodePort
        tcp:
          enabled: true
          nodePort: 30281
        tcps:
          enabled: true
          nodePort: 30284

  replicas: 1
