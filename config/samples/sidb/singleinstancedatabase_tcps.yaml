apiVersion: database.oracle.com/v4
kind: SingleInstanceDatabase
metadata:
  # Creates a primary SIDB with TCPS enabled.
  # Update namespace, secrets, TLS secret, image, and storage class before applying.
  name: sidb-sample
  namespace: <operator-watched-namespace>
spec:
  ## Use only alphanumeric characters for sid.
  sid: ORCL1

  ## DB edition.
  edition: enterprise

  ## Intended type of database.
  createAs: primary

  ## Grouped security settings.
  security:
    secrets:
      admin:
        secretName: db-admin-secret
        secretKey: oracle_pwd
        keepSecret: true
    tcps:
      enabled: true
      tlsSecret: sidb-tcps-tls

  ## DB character set.
  charset: AL32UTF8

  ## PDB name.
  pdbName: orclpdb1

  ## Enable ArchiveLog. Should be true to allow DB cloning.
  archiveLog: true

  ## Database image details.
  image:
    pullFrom: container-registry.oracle.com/database/enterprise_ru:latest-19
    imagePullPolicy: IfNotPresent
    pullSecrets: ocr-reg-cred

  ## Database storage details.
  persistence:
    oradata:
      size: 100Gi
      storageClass: oci-bv
      accessMode: ReadWriteOnce

  ## Optional service endpoint configuration.
  ## Enable tcps because spec.security.tcps.enabled is true.
  services:
    endpoints:
      - name: nodeport
        type: NodePort
        tcp:
          enabled: true
        tcps:
          enabled: true

  replicas: 1
