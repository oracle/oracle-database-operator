# Example DataguardBroker for cross-cluster NodePort topology.
# Prefer generating from standby status, then editing both member endpoints:
#   config/samples/sidb/render-dg-broker-from-status.sh sidb sidb-standby <namespace>
# See docs/sidb/dataguard/DATAGUARD_MULTI_CLUSTER_NODEPORT.md.
#
# Important:
# - Primary endpoint must be <primary-node-ip>:<primary-nodePort>, not port 1521
# - Standby endpoint must be <standby-node-ip>:<standby-nodePort>
# - Do not leave the local standby on ClusterIP
#   (sidb-standby.<ns>.svc.cluster.local:1521) for cross-cluster Broker use
# - Apply in the standby cluster (localRef points at sidb-standby)

apiVersion: database.oracle.com/v4
kind: DataguardBroker
metadata:
  name: sidb-standby-dg
  namespace: <operator-watched-namespace>
spec:
  execution:
    authWallet:
      enabled: true
    image: container-registry.oracle.com/database/enterprise_ru:latest
  topology:
    defaults:
      adminSecretRef:
        secretKey: oracle_pwd
        secretName: db-admin-secret
    members:
      - dbUniqueName: ORCLPRD
        endpoints:
          - host: "<primary-node-ip>"
            name: tcp
            port: 32330
            protocol: TCP
            serviceName: ORCLPRD
        name: primary-nodeport
        role: PRIMARY
      - dbUniqueName: ORCLSTBY
        endpoints:
          - host: "<standby-node-ip>"
            name: tcp
            port: 30281
            protocol: TCP
            serviceName: ORCLSTBY
        localRef:
          apiVersion: database.oracle.com/v4
          kind: SingleInstanceDatabase
          name: sidb-standby
          namespace: <operator-watched-namespace>
        name: sidb-standby
        role: PHYSICAL_STANDBY
    sourceKind: SingleInstanceDatabase
    sourceRef:
      apiVersion: database.oracle.com/v4
      kind: SingleInstanceDatabase
      name: sidb-standby
      namespace: <operator-watched-namespace>
