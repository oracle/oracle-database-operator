# Multi-standby Data Guard primary (Cluster 1), direct NodePort path (no CMAN).
# See docs/sidb/dataguard/DATAGUARD_MULTI_CLUSTER_NODEPORT.md.

apiVersion: database.oracle.com/v4
kind: SingleInstanceDatabase
metadata:
  name: sidb-primary
  namespace: <operator-watched-namespace>
spec:
  sid: ORCLPRD
  pdbName: APPPDB1
  createAs: primary
  edition: enterprise
  archiveLog: true
  flashBack: true
  forceLog: true

  dataguard:
    prereqs:
      enabled: true
    standbySources:
      - dbUniqueName: ORCLSTBY1
        host: "<cluster1-node-ip>"
        tcpPort: 30281
        tcpsEnabled: false
      - dbUniqueName: ORCLSTBY2
        host: "<cluster2-node-ip>"
        tcpPort: 30282
        tcpsEnabled: false
      - dbUniqueName: ORCLSTBY3
        host: "<cluster2-node-ip>"
        tcpPort: 30283
        tcpsEnabled: false

  security:
    secrets:
      admin:
        secretName: db-admin-secret
        secretKey: oracle_pwd
        keepSecret: true
      tde:
        secretName: tde-wallet-secret
        secretKey: tde_wallet_pwd

  image:
    pullFrom: container-registry.oracle.com/database/enterprise_ru:latest
    pullSecrets: ocr-reg-cred
    prebuiltDB: false
    imagePullPolicy: IfNotPresent

  initParams:
    sgaTarget: 14336
    pgaAggregateTarget: 2048
    processes: 800

  resources:
    requests:
      memory: "24Gi"
      cpu: "4"
    limits:
      memory: "24Gi"
      cpu: "4"

  persistence:
    oradata:
      size: 60Gi
      storageClass: oci-bv
      accessMode: ReadWriteOnce
    setWritePermissions: true

  services:
    endpoints:
      - name: nodeport
        type: NodePort
        tcp:
          enabled: true
          nodePort: 32330

  replicas: 1
