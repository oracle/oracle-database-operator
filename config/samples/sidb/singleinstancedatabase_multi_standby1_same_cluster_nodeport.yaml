# Multi-standby standby1 in the same cluster as primary (ClusterIP to primary).
# See docs/sidb/dataguard/DATAGUARD_MULTI_CLUSTER_NODEPORT.md.

apiVersion: database.oracle.com/v4
kind: SingleInstanceDatabase
metadata:
  name: sidb-standby1
  namespace: <operator-watched-namespace>
spec:
  sid: ORCLSTBY1
  edition: enterprise
  createAs: standby
  flashBack: true

  primarySource:
    connectString: "sidb-primary.default.svc.cluster.local:1521/ORCLPRD"

  security:
    secrets:
      admin:
        secretName: db-admin-secret
        secretKey: oracle_pwd
        keepSecret: true
      tde:
        secretName: tde-wallet-secret
        secretKey: tde_wallet_pwd
        walletZipFileKey: standby-wallet.zip
        walletRoot: /opt/oracle/oradata/dbconfig/ORCLSTBY1/.wallet

  image:
    pullFrom: container-registry.oracle.com/database/enterprise_ru:latest
    pullSecrets: ocr-reg-cred
    prebuiltDB: false
    imagePullPolicy: IfNotPresent

  dataguard:
    prereqs:
      enabled: true

  resources:
    requests:
      memory: "24Gi"
      cpu: "4"
    limits:
      memory: "24Gi"
      cpu: "4"

  persistence:
    oradata:
      size: 60Gi
      storageClass: oci-bv
      accessMode: ReadWriteOnce
    setWritePermissions: true

  services:
    endpoints:
      - name: nodeport
        type: NodePort
        tcp:
          enabled: true
          nodePort: 30281

  replicas: 1
