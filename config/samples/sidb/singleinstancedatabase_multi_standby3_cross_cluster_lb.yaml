# Multi-standby standby3 in Cluster 2 via primary NLB.
# Create only AFTER standby2 is READY. See docs/sidb/dataguard/DATAGUARD_MULTI_STANDBY_LB.md.

apiVersion: database.oracle.com/v4
kind: SingleInstanceDatabase
metadata:
  name: sidb-standby3
  namespace: <operator-watched-namespace>
spec:
  sid: ORCLSTBY3
  edition: enterprise
  createAs: standby
  flashBack: true

  primarySource:
    connectString: "<primary-nlb-ip-or-dns>:1521/ORCLPRD"

  security:
    secrets:
      admin:
        secretName: db-admin-secret
        secretKey: oracle_pwd
        keepSecret: true
      tde:
        secretName: tde-wallet-secret
        secretKey: tde_wallet_pwd
        walletZipFileKey: standby-wallet.zip
        walletRoot: /opt/oracle/oradata/dbconfig/ORCLSTBY3/.wallet

  image:
    pullFrom: container-registry.oracle.com/database/enterprise_ru:latest
    pullSecrets: ocr-reg-cred
    prebuiltDB: false
    imagePullPolicy: IfNotPresent

  dataguard:
    prereqs:
      enabled: true

  resources:
    requests:
      memory: "24Gi"
      cpu: "4"
    limits:
      memory: "24Gi"
      cpu: "4"

  persistence:
    oradata:
      size: 60Gi
      storageClass: oci-bv
      accessMode: ReadWriteOnce
    setWritePermissions: true

  services:
    external:
      type: LoadBalancer
      isKeep: false
      externalTrafficPolicy: Local
      annotations:
        oci.oraclecloud.com/load-balancer-type: "nlb"
        oci-network-load-balancer.oraclecloud.com/is-preserve-source: "false"
        oci-network-load-balancer.oraclecloud.com/internal: "true"
        oci-network-load-balancer.oraclecloud.com/subnet: "<standby-subnet-ocid>"
      tcp:
        enabled: true
        port: 1521

  replicas: 1
