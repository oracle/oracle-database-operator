# Sanitized four-member TCPS NLB example. Deploy in Cluster 2 after standby2.
apiVersion: database.oracle.com/v4
kind: SingleInstanceDatabase
metadata: {name: <standby3-database-name>, namespace: <namespace>}
spec:
  sid: <standby3-db-unique-name>
  edition: enterprise
  createAs: standby
  flashBack: true
  primarySource: {connectString: "<primary-nlb-dns>:1521/<primary-db-unique-name>", tcpsPort: 2484}
  security:
    secrets:
      admin: {secretName: <admin-secret>, secretKey: oracle_pwd, keepSecret: true}
      # For 19c, omit secretKey; provide the wallet ZIP only.
      tde: {secretName: <tde-secret>, walletZipFileKey: standby-wallet.zip, walletRoot: /opt/oracle/oradata/dbconfig/<standby3-db-unique-name>/.wallet}
    tcps: {enabled: true, tlsSecret: <standby3-tcps-tls-secret>}
  image: {pullFrom: <database-image>, prebuiltDB: false, imagePullPolicy: IfNotPresent}
  dataguard: {prereqs: {enabled: true}}
  persistence:
    oradata: {size: <storage-size>, storageClass: <storage-class>, accessMode: ReadWriteOnce}
    setWritePermissions: true
  services:
    external:
      type: LoadBalancer
      publishNotReadyAddresses: true
      externalTrafficPolicy: Local
      annotations:
        external-dns.alpha.kubernetes.io/hostname: <standby3-nlb-dns>
        oci.oraclecloud.com/load-balancer-type: nlb
        service.beta.kubernetes.io/oci-load-balancer-connection-idle-timeout: "3600"
        oci-network-load-balancer.oraclecloud.com/is-preserve-source: "false"
        oci-network-load-balancer.oraclecloud.com/internal: "true"
        oci-network-load-balancer.oraclecloud.com/subnet: <cluster2-subnet-ocid>
      tcp: {enabled: true, port: 1521}
      tcps: {enabled: true, port: 2484}
  replicas: 1
