# SIDB v4 full-field reference template.
#
# The active fields create a primary SIDB after you replace the image, Secret,
# and storage values for your environment. All other current SIDB fields are
# shown as commented, mode-specific options. Do not uncomment mutually
# exclusive source, restore, or True Cache blocks in the same manifest.
#
# This template intentionally does not use deprecated fields. The migration
# list is at docs/sidb/prerequisites/PREREQUISITES.md#deprecated-parameters.
#
apiVersion: database.oracle.com/v4
kind: SingleInstanceDatabase
metadata:
  name: sidb-sample
  namespace: default
  # labels:
  #   app.kubernetes.io/name: sidb
  # annotations:
  #   example.com/owner: database-team
spec:
  # Database identity and provisioning mode.
  # Valid editions: enterprise, standard, express, free.
  edition: enterprise
  # SID must be alphanumeric and no more than 12 characters.
  sid: ORCL1
  charset: AL32UTF8
  pdbName: ORCLPDB1
  # Valid modes: primary, clone, standby, truecache.
  createAs: primary
  # SIDB supports exactly one database Pod.
  replicas: 1

  # Database behavior.
  flashBack: false
  # Enable ARCHIVELOG for cloning, Data Guard, and True Cache blob generation.
  archiveLog: true
  forceLog: false
  # Set only for a Data Guard standby when converting its role.
  # convertToSnapshotStandby: false

  # Database image. Prefer a prebuilt image from Oracle Container Registry.
  image:
    pullFrom: container-registry.oracle.com/database/enterprise_ru:latest
    pullSecrets: ocr-reg-cred
    imagePullPolicy: IfNotPresent
    # Optional image version metadata; keep it aligned with the image tag.
    # version: 19.28.0.0
    # Set true only when the image or mounted data already contains a database.
    prebuiltDB: false

  # Database admin Secret. The Secret must be in metadata.namespace.
  security:
    secrets:
      admin:
        secretName: db-admin-secret
        secretKey: oracle_pwd
        keepSecret: true
        # Optional Secret mount override.
        # mountPath: /opt/oracle/admin-password
        # Skip operator-managed admin wallet initialization only when another
        # workflow supplies database credentials.
        # skipInitWallet: false
      # Optional TDE Secret.
      # tde:
      #   secretName: tde-wallet-secret
      #   secretKey: tde_wallet_pwd
      #   mountPath: /opt/oracle/admin/tde
      #   # Standby TDE wallet import options.
      #   walletZipFileKey: tde_wallet.zip
      #   walletRoot: /opt/oracle/admin/ORCL1/wallet
    # Optional TCPS configuration. Create the TLS Secret before applying SIDB.
    # tcps:
    #   enabled: true
    #   tlsSecret: sidb-primary-tcps-tls
    #   # Optional Data Guard client wallet override.
    #   clientWalletSecret: sidb-primary-client-wallet
    #   # Defaults to /run/secrets/tls_secret.
    #   certMountLocation: /run/secrets/tls_secret

  # Database storage. Set pvcName to use an existing PVC; otherwise configure
  # size, storageClass, and accessMode for dynamic provisioning.
  persistence:
    oradata:
      size: 100Gi
      storageClass: oci-bv
      accessMode: ReadWriteOnce
      # pvcName: existing-oradata-pvc
    # Optional Fast Recovery Area (FRA) PVC.
    # fra:
    #   size: 100Gi
    #   storageClass: oci-bv
    #   accessMode: ReadWriteOnce
    #   pvcName: existing-fra-pvc
    #   mountPath: /opt/oracle/fra
    #   recoveryAreaSize: 80Gi
    # Optional custom mount PVCs. Provide pvcName for an existing PVC, or
    # storageSizeInGb and storageClass for an operator-created PVC.
    # additionalPVCs:
    #   - mountPath: /mnt/backup
    #     pvcName: backup-pvc
    #   - mountPath: /mnt/archive
    #     storageSizeInGb: 100
    #     storageClass: oci-bv
    # Preserve operator-created PVCs when the SIDB is deleted.
    # retainOnDelete: true
    # Add one annotation to each operator-created PVC as key:value.
    # volumeClaimAnnotation: backup.example.com/enabled:true
    # Enable only when the storage backend needs an init container to set write
    # permissions on SIDB storage mount paths.
    # setWritePermissions: true

  # Optional PVC-backed setup and startup scripts. The referenced PVC contains
  # setup/ and startup/ directories.
  # scripts:
  #   setup:
  #     pvcName: sidb-scripts-pvc
  #   startup:
  #     pvcName: sidb-scripts-pvc

  # Optional Oracle initialization parameters. sgaTarget and pgaAggregateTarget
  # are MB. Size Pod resources to cover memoryTarget and Oracle overhead.
  # initParams:
  #   sgaTarget: 4096
  #   pgaAggregateTarget: 1024
  #   cpuCount: 2
  #   processes: 300
  #   memoryTarget: 8Gi

  # Optional PDB-level Oracle parameters.
  # pdbParameters:
  #   - pdbName: ORCLPDB1
  #     name: open_cursors
  #     value: "500"

  # Optional container resource and Pod configuration.
  # resources:
  #   requests:
  #     cpu: "2"
  #     memory: 16Gi
  #   limits:
  #     cpu: "4"
  #     memory: 16Gi
  # Override the memory-backed /dev/shm size with a positive quantity.
  # shmSize: 8Gi
  # nodeSelector:
  #   kubernetes.io/hostname: worker-node.example
  # Tolerations are optional and are applied only when explicitly provided.
  # Use them with a matching taint on dedicated SIDB nodes.
  # tolerations:
  #   - key: sidb-hugepages
  #     operator: Equal
  #     value: "true"
  #     effect: NoSchedule
  # hostAliases:
  #   - ip: 10.0.0.10
  #     hostnames:
  #       - primary.example.com
  # serviceAccountName: sidb-sa
  # Defaults to false. Enable only when the database Pod requires its service
  # account token.
  # automountServiceAccountToken: false
  # readinessCheckPeriod: 60
  # disableDefaultDiagVolumeClaim: true
  # securityContext:
  #   fsGroup: 54321
  #   sysctls:
  #     - name: kernel.sem
  #       value: "250 32000 100 128"
  # capabilities:
  #   add:
  #     - SYS_NICE
  # allowPrivilegeEscalation: false
  # envVars:
  #   - name: PRIMARY_TC_SERVICE_SCRIPT_PATH
  #     value: /custom/path/configure-primary-truecache-service.sh

  # Optional client Service endpoints. The in-cluster Service always exposes
  # TCP port 1521. Configure no more than three endpoints.
  # services:
  #   endpoints:
  #     - name: nodeport
  #       type: NodePort
  #       isKeep: false
  #       annotations:
  #         example.com/service-owner: database-team
  #       externalTrafficPolicy: Local
  #       publishNotReadyAddresses: false
  #       tcp:
  #         enabled: true
  #         nodePort: 31521
  #       tcps:
  #         enabled: true
  #         nodePort: 32484
  #     - name: loadbalancer
  #       type: LoadBalancer
  #       annotations:
  #         oci-network-load-balancer.oraclecloud.com/internal: "true"
  #       tcp:
  #         enabled: true
  #         port: 1521
  #       tcps:
  #         enabled: true
  #         port: 2484

  # Optional managed tnsnames.ora aliases.
  # tnsAliases:
  #   - name: PRIMARY_DG
  #     host: primary.example.com
  #     port: 1521
  #     serviceName: ORCL1_DGMGRL.example.com
  #     protocol: TCP
  #   - name: PRIMARY_TCPS
  #     host: primary.example.com
  #     port: 2484
  #     serviceName: ORCL1.example.com
  #     protocol: TCPS
  #     sslServerDN: CN=primary.example.com

  # Source-primary configuration for createAs: clone, standby, or truecache.
  # Choose exactly one source form: databaseRef, connectString, or details.
  # primarySource:
  #   # Same-namespace SIDB resource name.
  #   databaseRef: sidb-primary
  #   # External primary connection.
  #   # connectString: //primary.example.com:1521/ORCL1
  #   # tcpsPort: 2484
  #   # dbName: ORCL1
  #   # pdbName: ORCLPDB1
  #   # External primary details.
  #   # details:
  #   #   host: primary.example.com
  #   #   port: 1521
  #   #   sid: ORCL1
  #   #   pdbName: ORCLPDB1

  # Optional producer-side Data Guard configuration. Configure standbySources
  # on the primary only for standbys that use an external connectString source.
  # dataguard:
  #   # Disabled, Preview, or Managed. The effective default is Preview.
  #   mode: Managed
  #   prereqs:
  #     enabled: true
  #     brokerConfigDir: /opt/oracle/oradata
  #     standbyRedoSize: 1G
  #   authWallet:
  #     enabled: true
  #     passwordSecretRef:
  #       secretName: dg-auth-wallet-password
  #       secretKey: wallet_password
  #     rebuildToken: "1"
  #   standbySources:
  #     - dbUniqueName: ORCLSTBY
  #       host: standby.example.com
  #       tcpsEnabled: true
  #       tcpPort: 1521
  #       tcpsPort: 2484

  # True Cache configuration. Use only the fields for the selected mode.
  # For createAs: primary, prepare and publish the True Cache blob:
  # trueCache:
  #   generateBlob: true
  #   createConfigMap: true
  #   generatePath: /tmp/tc_config_blob.tar.gz
  #
  # For createAs: truecache, use a prepared blob and list the service mappings:
  # trueCache:
  #   truedbUniqueName: ORCLTC
  #   blobConfigMapRef: sidb-primary-truecache-blob
  #   blobConfigMapKey: tc_config_blob.tar.gz
  #   blobMountPath: /stage/tc_config_blob.tar.gz
  #   dbCredentialsWallet:
  #     secretName: primary-db-credential-wallet
  #     mountPath: /opt/oracle/primary-wallet
  #   autoTCServiceRegistration: true
  #   primarySchedulerCredentialName: primary_scheduler_credential
  #   trueCacheServices:
  #     - ORCLPDB1:TPDB_PRIMARY:TPDB_CACHE
  #
  # Compatibility-only True Cache service mappings. Prefer
  # trueCache.trueCacheServices for new manifests because it takes precedence.
  # trueCacheServices:
  #   - ORCLPDB1:TPDB_PRIMARY:TPDB_CACHE

  # Restore a primary SIDB from backup. Use only with createAs: primary and
  # choose exactly one source: objectStore or fileSystem.
  # restore:
  #   objectStore:
  #     ociConfig:
  #       configMapName: oci-config
  #       key: config
  #     privateKey:
  #       secretName: oci-api-key
  #       key: privatekey
  #     sourceDbWallet:
  #       secretName: source-db-wallet
  #       key: wallet.zip
  #     sourceDbWalletPassword:
  #       secretName: source-db-wallet-password
  #       key: password
  #     backupModuleConfig:
  #       configMapName: backup-module-config
  #       key: config
  #     opcInstallerZip:
  #       configMapName: backup-module-installer
  #       key: opc_installer.zip
  #     backupIdentity:
  #       bucketName: database-backups
  #       dbid: "1234567890"
  #       compartmentOcid: ocid1.compartment.oc1..replace-me
  #     encryptedBackup:
  #       enabled: true
  #       decryptPasswordSecret:
  #         secretName: backup-password
  #         key: password
  #   # fileSystem:
  #   #   backupPath: /mnt/backup
  #   #   catalogStartWith: /mnt/backup
  #   #   sourceDbWallet:
  #   #     secretName: source-db-wallet
  #   #     key: wallet.zip
  #   #   sourceDbWalletPassword:
  #   #     secretName: source-db-wallet-password
  #   #     key: password
  #   #   encryptedBackup:
  #   #     enabled: true
  #   #     decryptPasswordSecret:
  #   #       secretName: backup-password
  #   #       key: password
  #   target:
  #     dataRoot: /opt/oracle/oradata
  #     walletRoot: /opt/oracle/admin
  #   options:
  #     sourceDbName: ORCL1
  #     runCrosscheck: true
  #     runValidateOnly: false
  #     forceOpcReinstall: false

# Deprecated fields -- do not add these to new manifests.
#
# spec.loadBalancer                     -> spec.services.endpoints[]
# spec.listenerPort                     -> spec.services.endpoints[].tcp
# spec.tcpsListenerPort                 -> spec.services.endpoints[].tcps
# spec.serviceAnnotations               -> spec.services.endpoints[].annotations
# spec.services.external                -> spec.services.endpoints[] with name: loadbalancer
# spec.enableTCPS                       -> spec.security.tcps.enabled
# spec.tcpsTlsSecret                    -> spec.security.tcps.tlsSecret
# spec.tcpsCertRenewInterval            -> no replacement; TLS Secret owner manages renewal
# spec.security.tcps.certRenewInterval  -> no replacement; TLS Secret owner manages renewal
# spec.primaryDatabaseRef               -> spec.primarySource.databaseRef
# spec.adminPassword                    -> spec.security.secrets.admin
# spec.resourceRequirements             -> spec.resources
# spec.image.pullPolicy                 -> spec.image.imagePullPolicy
# spec.persistence.size                 -> spec.persistence.oradata.size
# spec.persistence.storageClass         -> spec.persistence.oradata.storageClass
# spec.persistence.accessMode           -> spec.persistence.oradata.accessMode
# spec.persistence.datafilesVolumeName  -> spec.persistence.oradata.pvcName
# spec.persistence.scriptsVolumeName    -> spec.scripts.setup.pvcName and spec.scripts.startup.pvcName
# spec.trueCache.generateEnabled        -> spec.trueCache.generateBlob and spec.trueCache.createConfigMap
