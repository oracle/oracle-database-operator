apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: sidb-write-permissions-scc
allowPrivilegedContainer: false
allowedCapabilities:
  - SYS_NICE
runAsUser:
  type: MustRunAsRange
  uidRangeMin: 0
  uidRangeMax: 54321
seLinuxContext:
  type: RunAsAny
fsGroup:
  type: MustRunAs
  ranges:
    - min: 54321
      max: 54321
supplementalGroups:
  type: MustRunAs
  ranges:
    - min: 54321
      max: 54321
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sidb-sa
  namespace: sidb-ns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: use-sidb-write-permissions-scc
  namespace: sidb-ns
rules:
  - apiGroups:
      - security.openshift.io
    resources:
      - securitycontextconstraints
    resourceNames:
      - sidb-write-permissions-scc
    verbs:
      - use
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: use-sidb-write-permissions-scc
  namespace: sidb-ns
subjects:
  - kind: ServiceAccount
    name: sidb-sa
    namespace: sidb-ns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: use-sidb-write-permissions-scc
