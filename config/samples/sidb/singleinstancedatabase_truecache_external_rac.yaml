# True Cache against an external RAC primary (not managed as a SIDB).
#
# Prerequisites:
# - Create the True Cache blob on the RAC primary with DBCA and load it into a
#   ConfigMap in this namespace (docs/sidb/truecache/TRUECACHE.md#4-external-host-si-or-rac).
# - For autoTCServiceRegistration: true, copy the helper onto every RAC node
#   (external RAC is outside the OCR SIDB image; do not skip the install) and
#   complete docs/sidb/prerequisites/PREREQUISITES.md#primary-pdb-service
#   (externaljob.ora + DBMS_SCHEDULER smoke test).
#
# Use a SCAN-based TCP connectString for bootstrap. Keep connectString on TCP;
# set primarySource.tcpsPort and security.tcps only when using TCPS.
# Hostnames, subnet OCIDs, and image tags below are sanitized placeholders —
# replace before apply.
#

apiVersion: database.oracle.com/v4
kind: SingleInstanceDatabase
metadata:
  name: tck8node1
  namespace: default
spec:
  ## Use only alphanumeric characters for sid
  sid: TCK8DB1

  ## True Cache is supported only with enterprise edition.
  edition: enterprise
  createAs: truecache

  primarySource:
    ## Service connect string for SQL*Plus/DBCA source access (TCP 1521).
    ## Use the RAC SCAN listener and a registered primary service.
    connectString: "primrac-scan.mysubnet.examplevcn.oraclevcn.com:1521/PRIM_UNQNAME.mysubnet.examplevcn.oraclevcn.com"
    ## Primary CDB short DB_NAME (SELECT name FROM v$database), e.g. PRIMDB.
    ## Optional short DB_NAME. Set it only when required by the image/operator;
    ## it does not replace the valid CDB service in connectString. Omit it if
    ## the connectString already reaches the primary CDB service.
    ## Never set to DB_UNIQUE_NAME or the full SCAN service.
    ## See docs/sidb/truecache/TRUECACHE.md and docs/sidb/README.md.
    dbName: PRIMDB

  trueCache:
    ## Create this ConfigMap from the manual DBCA blob before apply.
    blobConfigMapRef: orcl-primary-truecache-blob
    blobConfigMapKey: tc_config_blob.tar.gz
    blobMountPath: /stage/tc_config_blob.tar.gz
    truedbUniqueName: "TCK8DB1_FRA"
    ## PRIMARY_PDB_NAME:PRIMARY_SERVICE_NAME:TRUECACHE_SERVICE_NAME
    ## The first token is the primary PDB name (validated by the runtime).
    trueCacheServices:
      - "PRIMDB_PDB1:tcokeprim.example.com:tcokenodes.example.com"
    ## Automatic primary-side service registration via DBMS_SCHEDULER.
    ## External RAC: copy configure-primary-truecache-service.sh to the same
    ## path on every node (OCR SIDB primaries already ship it; this path does not).
    ## Keep it owned by oracle:oinstall and executable. Verify externaljob.ora
    ## runs external jobs as the Oracle software owner (not nobody:nobody).
    ## See docs/sidb/prerequisites/PREREQUISITES.md. Pod READY TO USE does not prove association.
    autoTCServiceRegistration: true
    ## Optional advanced: primary-side DBMS_SCHEDULER credential name.
    ## Prefer externaljob.ora as oracle:oinstall unless you need a credential.
    # primarySchedulerCredentialName: TC_ORACLE_OS_CRED

  ## Optional: custom helper path on the RAC nodes (same path every node).
  ## Set only when not using /home/oracle/configure-primary-truecache-service.sh.
  # envVars:
  #   - name: PRIMARY_TC_SERVICE_SCRIPT_PATH
  #     value: /custom/path/configure-primary-truecache-service.sh

  security:
    secrets:
      admin:
        secretName: db-admin-secret
        secretKey: oracle_pwd
        keepSecret: true
      tde:
        secretName: tde-wallet-secret
        secretKey: tde_wallet_pwd

  image:
    ## True Cache capable enterprise image required.
    pullFrom: container-registry.oracle.com/database/enterprise_ru:latest
    ## OCR database/enterprise_ru requires authenticated pull (accept OCR
    ## terms + auth token). Create ocr-reg-cred in this namespace.
    ## Anonymous pull of this licensed image is not supported.
    pullSecrets: ocr-reg-cred
    prebuiltDB: false
    imagePullPolicy: Always

  ## Optional: SIDB initParams and pod resources (not True Cache-specific).
  ## Uncomment and tune for lab or production. Omit both to use image/operator defaults.
  # initParams:
  #   sgaTarget: 16384
  #   pgaAggregateTarget: 4096
  #   processes: 1200
  # resources:
  #   requests:
  #     memory: "32Gi"
  #     cpu: "2"
  #   limits:
  #     memory: "32Gi"
  #     cpu: "2"

  ## Optional node selector.
  # nodeSelector:
  #   role: truecache

  persistence:
    oradata:
      ## Lab often used 60Gi; increase if redo-heavy creates fill the volume on retries.
      size: 60Gi
      storageClass: "oci-bv"
      accessMode: "ReadWriteOnce"
    setWritePermissions: true

  ## Prefer services.endpoints. Lab YAMLs also worked with legacy services.external
  ## (same LoadBalancer shape without the list wrapper).
  services:
    endpoints:
      - name: loadbalancer
        type: LoadBalancer
        ## Keep Service across delete/recreate so NLB / assigned IP can be reused.
        isKeep: true
        externalTrafficPolicy: Local
        annotations:
          oci.oraclecloud.com/load-balancer-type: "nlb"
          oci-network-load-balancer.oraclecloud.com/internal: "true"
          oci-network-load-balancer.oraclecloud.com/is-preserve-source: "false"
          ## Optional: pin frontend IP across delete/recreate (lab used this).
          # oci-network-load-balancer.oraclecloud.com/assigned-private-ipv4: "10.0.2.27"
          ## Placeholder subnet OCID — replace with your VCN subnet OCID.
          oci-network-load-balancer.oraclecloud.com/subnet: "ocid1.subnet.oc1..<REPLACE_WITH_SUBNET_OCID>"
          external-dns.alpha.kubernetes.io/hostname: "tck8node1.internal.example.com"
        tcp:
          enabled: true
          port: 1521
        ## Uncomment for TCPS clients. Also enable security.tcps and set
        ## primarySource.tcpsPort to the reachable primary TCPS port. Keep
        ## primarySource.connectString on the TCP SCAN bootstrap endpoint.
        # tcps:
        #   enabled: true
        #   port: 2484

  ## Count of Database Pods. Should be 1 for True Cache.
  replicas: 1
