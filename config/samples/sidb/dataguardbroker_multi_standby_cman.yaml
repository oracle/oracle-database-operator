# Four-member DataguardBroker for multi-standby CMAN topology.
# Apply in Cluster 2 (sourceRef points at a local standby such as sidb-standby3).
# Cluster 1 members use Cluster 1 CMAN NodePort; Cluster 2 members use Cluster 2 CMAN NodePort.
# See docs/sidb/dataguard/DATAGUARD_MULTI_STANDBY_CMAN.md.

apiVersion: database.oracle.com/v4
kind: DataguardBroker
metadata:
  name: sidb-multi-dg
  namespace: <operator-watched-namespace>
spec:
  execution:
    authWallet:
      enabled: true
    image: container-registry.oracle.com/database/enterprise_ru:latest
  topology:
    defaults:
      adminSecretRef:
        secretKey: oracle_pwd
        secretName: db-admin-secret
    members:
      - dbUniqueName: ORCLPRD
        name: primary-cman
        role: PRIMARY
        endpoints:
          - host: "<cluster1-cman-node-ip>"
            name: tcp
            port: 30189
            protocol: TCP
            serviceName: ORCLPRD
      - dbUniqueName: ORCLSTBY1
        name: sidb-standby1
        role: PHYSICAL_STANDBY
        endpoints:
          - host: "<cluster1-cman-node-ip>"
            name: tcp
            port: 30189
            protocol: TCP
            serviceName: ORCLSTBY1
      - dbUniqueName: ORCLSTBY2
        name: sidb-standby2
        role: PHYSICAL_STANDBY
        endpoints:
          - host: "<cluster2-cman-node-ip>"
            name: tcp
            port: 30189
            protocol: TCP
            serviceName: ORCLSTBY2
        localRef:
          apiVersion: database.oracle.com/v4
          kind: SingleInstanceDatabase
          name: sidb-standby2
          namespace: <operator-watched-namespace>
      - dbUniqueName: ORCLSTBY3
        name: sidb-standby3
        role: PHYSICAL_STANDBY
        endpoints:
          - host: "<cluster2-cman-node-ip>"
            name: tcp
            port: 30189
            protocol: TCP
            serviceName: ORCLSTBY3
        localRef:
          apiVersion: database.oracle.com/v4
          kind: SingleInstanceDatabase
          name: sidb-standby3
          namespace: <operator-watched-namespace>
    sourceKind: SingleInstanceDatabase
    sourceRef:
      apiVersion: database.oracle.com/v4
      kind: SingleInstanceDatabase
      name: sidb-standby3
      namespace: <operator-watched-namespace>
