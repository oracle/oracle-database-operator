# Expose the controller-runtime metrics endpoint directly from the manager using
# the built-in secure metrics server. The certificate is provisioned by
# cert-manager and mounted at the default path expected by main.go.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
      - name: manager
        args:
        - "--metrics-addr=:8443"
        - "--enable-leader-election"
        ports:
        - containerPort: 8443
          name: https
          protocol: TCP
        volumeMounts:
        - mountPath: /metrics-certs
          name: metrics-certs
          readOnly: true
      volumes:
      - name: metrics-certs
        secret:
          defaultMode: 420
          secretName: metrics-server-cert
