# OLM creates the webhook certificate, but it does not create the separate
# cert-manager certificate used by the secure metrics endpoint. Serve metrics
# over HTTP for the OLM deployment so the bundle has no metrics Secret dependency.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
      - name: manager
        env:
        - name: METRICS_SECURE
          value: "false"
        volumeMounts:
        - $patch: delete
          mountPath: /metrics-certs
      volumes:
      - $patch: delete
        name: metrics-certs
