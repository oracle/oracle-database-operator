# Scenario: one CMAN replica routing to two SIDBs with explicit destinations.
#
# Unlike cman-sidb-peer.yaml, each rule restricts dst to the corresponding SIDB
# Kubernetes Service instead of accepting dst="*". Use this generated-rule
# pattern when destination filtering must be explicit.
# Also see:
#   Pattern guide: docs/cman/README.md#choosing-a-cman-configuration-pattern
#   Sample index:  docs/cman/samples/README.md
#   Canonical multi-backend file-mode template:
#     config/samples/connectionmanager/cman-sidb-peer-filemode.yaml
#   Canonical single-backend file-mode template:
#     config/samples/connectionmanager/cman-sidb-filemode.yaml
#
apiVersion: network.oracle.com/v4
kind: ConnectionManager
metadata:
  name: cman-sidb
  namespace: default
spec:
  runtime:
    image: "<cman-container-image>"
    imagePullPolicy: Always
    replicas: 1
  service:
    internal:
      enabled: true
      ports:
        - name: cman
          port: 1521
          targetPort: 1521
    external:
      enabled: true
      serviceType: LoadBalancer
      externalTrafficPolicy: Local
      annotations:
        oci.oraclecloud.com/load-balancer-type: "nlb"
        oci-network-load-balancer.oraclecloud.com/internal: "true"
        oci-network-load-balancer.oraclecloud.com/is-preserve-source: "false"
        oci-network-load-balancer.oraclecloud.com/subnet: "<subnet-ocid>"
      ports:
        - name: cman
          port: 1521
          targetPort: 1521
  logLevel: user
  traceLevel: user
  registrationInvitedNodes: "*"
  rules:
    - host: sidb-sample.default.svc.cluster.local
      src: "*"
      dst: sidb-sample.default.svc.cluster.local
      srv: apppdb1
      action: accept
    - host: sidb-cman-peer.default.svc.cluster.local
      src: "*"
      dst: sidb-cman-peer.default.svc.cluster.local
      srv: apppdb2
      action: accept
