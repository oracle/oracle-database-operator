apiVersion: database.oracle.com/v4
kind: ShardingDatabase
metadata:
  name: shdb-user-direct
  namespace: shns
spec:
  storageClass: oci
  dbImage: dbocir/oracle/database:19.32.0.0
  gsmImage: dbocir/oracle/database:19.32.0.0-gsm
  shardingType: USER
  replicationType: DG
  isExternalSvc: false
  isDeleteOraPvc: true
  dbSecret:
    name: db-user-pass-rsa
    pwdFileName: pwdfile.enc
    tdePwdFileName: tdepwdfile.enc
    keyFileName: key.pem
  catalog:
    - name: catalog
      storageSizeInGb: 50
      imagePullPolicy: Always
      sharding: USER
      repl: DG
      autoVncr: OFF
      agentPort: 8080
  gsm:
    - name: gsm1
      storageSizeInGb: 50
      imagePullPolicy: Always
      region: primary
  shard:
    - name: udshard1
      shardSpace: uspace2
      deployAs: PRIMARY
      cpuThreshold: 65
      diskThreshold: 10
      validateNetwork: true
