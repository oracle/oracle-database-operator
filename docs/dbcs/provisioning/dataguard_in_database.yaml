apiVersion: database.oracle.com/v4
kind: DbcsSystem
metadata:
  name: dbcssystem-existing
spec:
  id: "ocid1.dbsystem.oc1..<REPLACE_WITH_DB_SYSTEM_OCID>"
  ociConfigMap: "oci-cred"
  ociSecret: "oci-privatekey"
  dataGuard:
    primaryDatabaseId: "ocid1.database.oc1..<REPLACE_WITH_DATABASE_OCID>"
    dbAdminPasswordSecret: "admin-password"
    protectionMode: "MAXIMUM_PERFORMANCE"
    transportType: "ASYNC"
    enabled: true
    displayName: "standbydbsystem2"
    availabilityDomain: "OLou:AP-MUMBAI-1-AD-1"
    shape: "VM.Standard2.1"
    subnetId: "ocid1.subnet.oc1..<REPLACE_WITH_SUBNET_OCID>"
    hostName: "shost1234"

