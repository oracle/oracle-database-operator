apiVersion: database.oracle.com/v4
kind: DbcsSystem
metadata:
  name: dbcssystem-create
spec:
  ociConfigMap: "oci-cred-mumbai"
  ociSecret: "oci-privatekey"
  dbSystem:
    availabilityDomain: "OLou:AP-MUMBAI-1-AD-1"
    compartmentId: "ocid1.compartment.oc1..<REPLACE_WITH_COMPARTMENT_OCID>"
    dbAdminPasswordSecret: "admin-password"
    dbEdition: "ENTERPRISE_EDITION_HIGH_PERFORMANCE"
    dbName: "kmsdb"
    displayName: "kmsdbsystem"
    licenseModel: "BRING_YOUR_OWN_LICENSE"
    dbVersion: "19c"
    dbWorkload: "OLTP"
    hostName: "kmshost"
    shape: "VM.Standard2.2"
    domain: "subdda0b5eaa.cluster1.oraclevcn.com"
    sshPublicKeys:
     - "oci-publickey"
    subnetId: "ocid1.subnet.oc1..<REPLACE_WITH_SUBNET_OCID>"
  kmsConfig:
    vaultName: "dbvault-local-06"
    compartmentId: "ocid1.compartment.oc1..<REPLACE_WITH_COMPARTMENT_OCID>"
    keyName: "dbkey-local-06"
