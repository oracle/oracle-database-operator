    - pdbName: "pdb_example_sdk_14"
      tdeWalletPassword: "tde-password"
      pdbAdminPassword: "pdb-password"
      shouldPdbAdminAccountBeLocked: false
      freeformTags:
        Department: "HR"
    - pdbName: "pdb_example_sdk_15"
      tdeWalletPassword: "tde-password"
      pdbAdminPassword: "pdb-password"
      shouldPdbAdminAccountBeLocked: false
      freeformTags:
        Department: "IT"