# Scenario: one CMAN replica forwarding all accepted traffic to one SIDB.
#
# The single global next_hop points to sidb-sample. This pattern is not
# service-aware: use cman-sidb-peer-nexthop.yaml when different requested
# service names must select different SIDB backends. The CMAN image must support
# next_hop in the mounted cman.ora file.
# Also see:
#   Pattern guide: docs/trafficmanager/README.md#choosing-a-cman-configuration-pattern
#   Sample index:  docs/trafficmanager/samples/README.md
#   Canonical multi-backend file-mode template:
#     config/samples/trafficmanager/cman-sidb-peer-filemode.yaml
#   Canonical single-backend file-mode template:
#     config/samples/trafficmanager/cman-sidb-filemode.yaml
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: cman-sidb-nexthop-config
  namespace: default
data:
  cman.ora: |
    ######################################################################
    # Single global next-hop. All accepted traffic is forwarded to sidb-sample.
    ######################################################################

    CMAN_cman-sidb.default.svc.cluster.local =
    (configuration=
      (address=(protocol=tcp)(host=cman-sidb.default.svc.cluster.local)(port=1521))
      (next_hop=
        (description=(address=(protocol=tcp)(host=sidb-sample.default.svc.cluster.local)(port=1521)))
      )
      (parameter_list =
        (connection_statistics=yes)
        (log_directory=/u01/app/oracle/product/23ai/client_1/network/log)
        (log_level=user)
        (trace_directory=/u01/app/oracle/product/23ai/client_1/network/trace)
        (trace_level=user)
        (valid_node_checking_registration=on)
        (registration_invited_nodes=*)
      )
      (rule_list=
        (rule=
           (src=*)(dst=*)(srv=apppdb1)(act=accept)
           (action_list=(aut=off)(moct=0)(mct=0)(mit=0)(conn_stats=on))
        )
      )
    )
---
apiVersion: network.oracle.com/v4
kind: TrafficManager
metadata:
  name: cman-sidb
  namespace: default
spec:
  type: cman
  runtime:
    image: "<cman-container-image-with-next-hop-support>"
    imagePullPolicy: Always
    replicas: 1
  service:
    internal:
      enabled: true
      ports:
        - name: cman
          port: 1521
          targetPort: 1521
    external:
      enabled: true
      serviceType: LoadBalancer
      externalTrafficPolicy: Local
      annotations:
        oci.oraclecloud.com/load-balancer-type: "nlb"
        oci-network-load-balancer.oraclecloud.com/internal: "true"
        oci-network-load-balancer.oraclecloud.com/is-preserve-source: "false"
        oci-network-load-balancer.oraclecloud.com/subnet: "<subnet-ocid>"
      ports:
        - name: cman
          port: 1521
          targetPort: 1521
  cman:
    configSource:
      configMapRef:
        name: cman-sidb-nexthop-config
        key: cman.ora
