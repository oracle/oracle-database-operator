# Scenario: two CMAN replicas routing to two SIDBs with service-aware next hops.
#
# Clients connect through either CMAN replica and request apppdb1 or apppdb2.
# use_service_as_tnsnames_alias resolves that service name through the embedded
# alias block, selecting the corresponding SIDB Kubernetes Service. Add one
# alias and one accept rule per SIDB/service pair. This is the combined sample
# for multiple CMAN replicas, multiple SIDBs, and per-service next-hop routing.
# The CMAN image must extract CMAN_TNSNAMES_BEGIN/END into tnsnames.ora.
# Also see:
#   Pattern guide: docs/trafficmanager/README.md#choosing-a-cman-configuration-pattern
#   Sample index:  docs/trafficmanager/samples/README.md
#   Canonical multi-backend file-mode template:
#     config/samples/trafficmanager/cman-sidb-peer-filemode.yaml
#   Canonical single-backend file-mode template:
#     config/samples/trafficmanager/cman-sidb-filemode.yaml
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: cman-sidb-peer-nexthop-config
  namespace: default
data:
  cman.ora: |
    ######################################################################
    # Service-aware next-hop. Recommended for multiple CMAN replicas.
    # The CMAN image extracts the commented alias block into tnsnames.ora.
    ######################################################################

    # CMAN_TNSNAMES_BEGIN
    # apppdb1 =
    #   (description=
    #     (address=(protocol=tcp)(host=sidb-sample.default.svc.cluster.local)(port=1521))
    #     (connect_data=(service_name=apppdb1))
    #   )
    #
    # apppdb2 =
    #   (description=
    #     (address=(protocol=tcp)(host=sidb-cman-peer.default.svc.cluster.local)(port=1521))
    #     (connect_data=(service_name=apppdb2))
    #   )
    # CMAN_TNSNAMES_END

    CMAN_cman-sidb.default.svc.cluster.local =
    (configuration=
      (address=(protocol=tcp)(host=cman-sidb.default.svc.cluster.local)(port=1521))
      (parameter_list =
        (connection_statistics=yes)
        (log_directory=/u01/app/oracle/product/23ai/client_1/network/log)
        (log_level=user)
        (trace_directory=/u01/app/oracle/product/23ai/client_1/network/trace)
        (trace_level=user)
        (valid_node_checking_registration=on)
        (registration_invited_nodes=*)
        (use_service_as_tnsnames_alias=on)
      )
      (rule_list=
        (rule=
           (src=*)(dst=*)(srv=apppdb1)(act=accept)
           (action_list=(aut=off)(moct=0)(mct=0)(mit=0)(conn_stats=on))
        )
        (rule=
           (src=*)(dst=*)(srv=apppdb2)(act=accept)
           (action_list=(aut=off)(moct=0)(mct=0)(mit=0)(conn_stats=on))
        )
      )
    )
---
apiVersion: network.oracle.com/v4
kind: TrafficManager
metadata:
  name: cman-sidb
  namespace: default
spec:
  type: cman
  runtime:
    image: "<cman-container-image-with-embedded-tnsnames-support>"
    imagePullPolicy: Always
    replicas: 2
  service:
    internal:
      enabled: true
      ports:
        - name: cman
          port: 1521
          targetPort: 1521
    external:
      enabled: true
      serviceType: LoadBalancer
      externalTrafficPolicy: Local
      annotations:
        oci.oraclecloud.com/load-balancer-type: "nlb"
        oci-network-load-balancer.oraclecloud.com/internal: "true"
        oci-network-load-balancer.oraclecloud.com/is-preserve-source: "false"
        oci-network-load-balancer.oraclecloud.com/subnet: "<subnet-ocid>"
      ports:
        - name: cman
          port: 1521
          targetPort: 1521
  cman:
    configSource:
      configMapRef:
        name: cman-sidb-peer-nexthop-config
        key: cman.ora
