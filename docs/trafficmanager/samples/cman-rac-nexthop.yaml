# Scenario: one CMAN replica forwarding accepted RAC service traffic to a RAC
# SCAN Service through one global next_hop.
#
# Use this pattern when all accepted services share the same RAC SCAN listener.
# A global next_hop is not service-aware across different backend listeners; use
# the alias pattern from cman-sidb-peer-nexthop.yaml when services must select
# different database listener endpoints.
# Also see:
#   Pattern guide: docs/trafficmanager/README.md#choosing-a-cman-configuration-pattern
#   Sample index:  docs/trafficmanager/samples/README.md
#   Canonical multi-backend file-mode template:
#     config/samples/trafficmanager/cman-sidb-peer-filemode.yaml
#   Canonical single-backend file-mode template:
#     config/samples/trafficmanager/cman-sidb-filemode.yaml
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: cman-rac-config
  namespace: rac
data:
  cman.ora: |
    CMAN_cman-rac.rac.svc.cluster.local =
    (configuration=
      (address=(protocol=tcp)(host=cman-rac.rac.svc.cluster.local)(port=1521))
      (next_hop=
        (description=
          (address=(protocol=tcp)(host=racnode-scan.rac.svc.cluster.local)(port=1521))
        )
      )
      (parameter_list =
        (connection_statistics=yes)
        (log_directory=/u01/app/oracle/product/23ai/client_1/network/log)
        (log_level=user)
        (trace_directory=/u01/app/oracle/product/23ai/client_1/network/trace)
        (trace_level=user)
        (valid_node_checking_registration=on)
        (registration_invited_nodes=*)
      )
      (rule_list=
        (rule=
          (src=*)(dst=*)(srv=soepdb)(act=accept)
          (action_list=(aut=off)(moct=0)(mct=0)(mit=0)(conn_stats=on))
        )
      )
    )
---
apiVersion: network.oracle.com/v4
kind: TrafficManager
metadata:
  name: cman-rac
  namespace: rac
spec:
  type: cman
  runtime:
    image: "<cman-container-image-with-next-hop-support>"
    imagePullPolicy: Always
    replicas: 1
  service:
    internal:
      enabled: true
      ports:
        - name: cman
          port: 1521
          targetPort: 1521
    external:
      enabled: true
      serviceType: LoadBalancer
      externalTrafficPolicy: Local
      annotations:
        oci.oraclecloud.com/load-balancer-type: "nlb"
        oci-network-load-balancer.oraclecloud.com/internal: "true"
        oci-network-load-balancer.oraclecloud.com/is-preserve-source: "false"
        oci-network-load-balancer.oraclecloud.com/subnet: "<subnet-ocid>"
      ports:
        - name: cman
          port: 1521
          targetPort: 1521
  cman:
    configSource:
      configMapRef:
        name: cman-rac-config
        key: cman.ora
