apiVersion: v1
kind: PersistentVolume
metadata:
  name: oke-fsspv
spec:
  capacity:
    storage: 100Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nosuid
  csi:
    driver: fss.csi.oraclecloud.com
    volumeHandle: "<FILE_SYSTEM_OCID>:<MountTargetIP:/privateai_models"
