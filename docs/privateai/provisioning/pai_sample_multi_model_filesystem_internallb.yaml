---
# Specifies the custom resource API version
apiVersion: privateai.oracle.com/v4

# Defines the type of resource (Private AI)
kind: PrivateAi

# Provide identification and scoping metadata
metadata:
  # Name of Private AI resource
  name: pai-sample
  # Kubernetes Namespace where this resource will be deployed
  namespace: pai

# Main specification for Private AI
spec:
  security:
    authEnabled: true
    secret:
      name: paisecret
      mountLocation: /privateai/ssl
    tls:
      secretName: privateai-tls
      mountLocation: /privateai/ssl
      items:
      - key: tls.crt
        path: cert.pem
      - key: tls.key
        path: key.pem
      - key: keystore.p12
        path: keystore
  runtime:
    image:
      name: container-registry.oracle.com/database/private-ai:latest
      pullSecret: oracle-container-registry-secret
    replicas: 3
    workerNodes:
    - <<Replace with the worker nodes>>
    resources:
      requests:
        memory: "8Gi"
        cpu: "2"
      limits:
        memory: "8Gi"
        cpu: "2"
  configuration:
    configFile:
      name: multiconfigjson
      mountLocation: /privateai/config
  storage:
    pvcList:
      oke-fsspvc: /privateai/models
  networking:
    listeners:
      https:
        enabled: true
        port: 8443
    service:
      ports:
      - port: 443
        targetPort: 8443
        protocol: TCP
      privateLoadBalancer:
        enabled: true
        annotations:
          oci.oraclecloud.com/reserved-private-ips: "XX.XX.XX.XX"
