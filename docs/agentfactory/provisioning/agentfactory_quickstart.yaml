apiVersion: privateai.oracle.com/v4
kind: AgentFactory
metadata:
  name: agentfactory-sample
  # Must match the SIDB namespace and the operator WATCH_NAMESPACE list.
  namespace: paf
spec:
  runtime:
    # OpenShift: create agentfactory-sa, authorize anyuid (or your approved
    # SCC) for that SA, then set the field when your CRD serves it:
    # serviceAccountName: agentfactory-sa
    # If kubectl explain agentfactory.spec.runtime.serviceAccountName fails,
    # omit this field and authorize the namespace default ServiceAccount.
    image:
      name: container-registry.oracle.com/database/applied-ai:latest
      pullPolicy: IfNotPresent
      # Keep OCR with ocr-reg-cred, or change both the image and Secret for your registry.
      pullSecret: ocr-reg-cred
    replicas: 1
  configuration:
    uiAdminUsername: admin@example.com
  database:
    connectionType: Details
    username: paf_user
    details:
      protocol: TCP
      host: sidb-sample.paf.svc.cluster.local
      port: 1521
      serviceName: ORCLPDB1
    airGapped: false
    bootstrap:
      enabled: true
      adminCredentials:
        secretName: paf-db-bootstrap-admin
        usernameKey: sys
        passwordKey: password
        privilege: SYSDBA
      cleanupPolicy: Retain
  security:
    secret:
      name: agentfactory-runtime-secret
      # OpenShift REQUIRED: set mountLocation away from /run/secrets.
      # OpenShift/RHEL already uses /run/secrets (rhsm/platform files); the
      # AgentFactory default path conflicts and Secret files go missing.
      # mountLocation: /mnt/af-secrets
      uiAdminPasswordKey: paf_ui_admin_password
      dbPasswordKey: paf_db_password
  storage:
    volumes:
    - name: app-mount
      mountPath: /mount
      source:
        pvc:
          # OKE example. On OpenShift, replace with a supported StorageClass
          # (RWO is fine for replicas: 1; use RWX/shared storage when replicas > 1).
          storageClass: oci-bv
          size: 100Gi
          accessModes:
          - ReadWriteOnce
          deletePvcOnDelete: false
  networking:
    service:
      cluster:
        enabled: true
      # OpenShift: if you enable a LoadBalancer, replace OCI-specific annotations
      # with your cloud-provider annotations, or use ClusterIP plus an OpenShift Route.
