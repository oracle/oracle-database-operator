apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: shns-oracle-user-scc
allowPrivilegedContainer: false
allowedCapabilities:
  - NET_ADMIN
  - NET_RAW
  - SYS_NICE
requiredDropCapabilities:
  - ALL
runAsUser:
  type: MustRunAs
  uid: 54321
seLinuxContext:
  type: RunAsAny
fsGroup:
  type: MustRunAs
  ranges:
    - min: 54321
      max: 54321
supplementalGroups:
  type: MustRunAs
  ranges:
    - min: 54321
      max: 54321
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shns-sa
  namespace: shns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: use-shns-oracle-scc
  namespace: shns
rules:
  - apiGroups:
      - security.openshift.io
    resources:
      - securitycontextconstraints
    resourceNames:
      - shns-oracle-user-scc
    verbs:
      - use
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: use-shns-oracle-scc
  namespace: shns
subjects:
  - kind: ServiceAccount
    name: shns-sa
    namespace: shns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: use-shns-oracle-scc
