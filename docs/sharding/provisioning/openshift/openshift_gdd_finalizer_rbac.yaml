apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: statefulset-controller-shardingdatabase-finalizer
  namespace: shns
rules:
  - apiGroups:
      - database.oracle.com
    resources:
      - shardingdatabases/finalizers
    resourceNames:
      - sdb-system
    verbs:
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: statefulset-controller-shardingdatabase-finalizer
  namespace: shns
subjects:
  - kind: ServiceAccount
    name: statefulset-controller
    namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: statefulset-controller-shardingdatabase-finalizer
